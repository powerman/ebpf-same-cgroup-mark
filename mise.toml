# jdx/mise-action installs only releases older than a day, so a newer one would fail CI.
min_version = '2026.10.19'

[settings]
lockfile = true # DO NOT FORGET TO `touch mise.lock` if mise.lock does not exist!
npm.package_manager = 'pnpm' # Avoid .mise/locks/** sidecars required by default aube.


[tools]
node = 'lts'
pnpm = 'latest'
go = 'latest'

#--- Generate
# MockGen generates mock implementations of Go interfaces.
'go:go.uber.org/mock/mockgen' = 'latest'
# A mock interface code generator (a fork of github.com/derision-test/go-mockgen).
'go:github.com/unknwon/go-mockgen/cmd/go-mockgen' = 'latest'

#--- Format
# Opinionated Code Formatter.
prettier = 'latest'
# A TOML toolkit written in Rust.
taplo = 'latest'
# An extensible command line tool or library to format yaml files.
yamlfmt = 'latest'
# goimports updates Go import lines (used by go-mockgen after generation).
'go:golang.org/x/tools/cmd/goimports' = 'latest'

#--- Lint
# Static checker for GitHub Actions workflow files.
actionlint = 'latest'
# Fast linters runner for Go.
# Version must match .golangci.yml.
golangci-lint = '2.15'

#--- Test
# 'go test' runner with output optimized for humans.
gotestsum = 'latest'
# Tool for inspection and simple manipulation of eBPF programs and maps.
'github:libbpf/bpftool' = { version = 'latest', bin = 'bpftool' }

#--- Release
# A highly customizable Changelog Generator that follows Conventional Commit specifications.
git-cliff = 'latest'
# GitHub's official command line tool.
gh = 'latest'


[vars]
cover = '.cache/cover.out'


[tasks.'changelog:skip-commit']
description = 'Add commit hash to .cliffignore to exclude from CHANGELOG'
usage = 'arg "<commit>" help="Git revision (e.g. HEAD or a1b2c4d)"'
run = 'git rev-parse --verify "${usage_commit}" >> .cliffignore'

[tasks.generate]
description = 'Generate everything'
depends = ['generate:*']

[tasks.fix]
description = 'Apply all automatic fixes'
depends = ['fix:*']

[tasks.fmt]
description = 'Format all files'
depends = ['fmt:*']

[tasks.lint]
description = 'Run all linters'
depends = ['lint:*']

[tasks.build]
description = 'Build everything'
depends = ['build:*']

[tasks.test]
description = 'Run all tests'
depends = ['test:*']

[tasks.default]
description = 'Run all formatters, linters and tests'
depends = ['fmt', 'lint', 'test']

[tasks.ci]
description = 'Run all CI tasks'
depends = ['generate', 'fmt', 'lint', 'test']
# Is working tree clean after generate/fmt?
run = '! git status --porcelain | tee /dev/stderr | grep -q .'

[tasks.'generate:go']
description = 'Generate Go code'
run = 'go generate ./...'

[tasks.'fix:go']
description = 'Modernize Go code by go fix'
run = 'mise run keep-vendored go fix ./...'

[tasks.'fix:golangci-lint']
description = 'Fix issues found by golangci-lint'
wait_for = ['fix:go']
# Issues without automatic fixes are reported by lint:go.
run = 'mise run keep-vendored golangci-lint run --fix --issues-exit-code=0'

[tasks.'fmt:markdown']
description = 'Format markdown files'
sources = ['**/*.md']
run = 'prettier --write "**/*.md"'

# Taplo doesn't respect .gitignore.
[tasks.'fmt:toml']
description = 'Format TOML files'
sources = ['**/*.toml']
env.RUST_LOG = 'warn' # Hide INFO logs of taplo.
run = "git ls-files -z -co --exclude-standard '*.toml' | xargs -0 -r taplo format"

[tasks.'fmt:yaml']
description = 'Format YAML files'
sources = ['**/*.yml', '**/*.yaml']
run = "git ls-files -z -co --exclude-standard '*.yml' '*.yaml' | xargs -0 -r yamlfmt"

[tasks.'fmt:go']
description = 'Format Go code'
run = 'golangci-lint fmt'

[tasks.'lint:workflows']
description = 'Lint GitHub Action workflows'
run = 'actionlint'

[tasks.'lint:markdown']
description = 'Lint markdown files'
wait_for = ['fmt:markdown']
sources = ['**/*.md']
run = 'prettier --check "**/*.md"'

[tasks.'lint:toml']
description = 'Check TOML files formatting'
wait_for = ['fmt:toml']
sources = ['**/*.toml']
env.RUST_LOG = 'warn' # Hide INFO logs of taplo.
run = "git ls-files -z -co --exclude-standard '*.toml' | xargs -0 -r taplo format --check"

[tasks.'lint:yaml']
description = 'Check YAML files formatting'
wait_for = ['fmt:yaml']
sources = ['**/*.yml', '**/*.yaml']
run = "git ls-files -z -co --exclude-standard '*.yml' '*.yaml' | xargs -0 -r yamlfmt -lint"

[tasks.'lint:go']
description = 'Lint Go files'
depends = ['build:bpf']
run = 'golangci-lint run'

[tasks.'build:bpf']
description = 'Compile BPF object file'
depends = ['cachedir']
sources = ['bpf/same-cgroup-mark.c']
outputs = ['.cache/same-cgroup-mark.bpf.o']
run = 'clang -O2 -g -target bpf -I/usr/include -idirafter "/usr/include/$(uname -m)-linux-gnu" -c bpf/same-cgroup-mark.c -o .cache/same-cgroup-mark.bpf.o'

[tasks.'build:go']
description = 'Build the Go binary'
depends = ['cachedir', 'build:bpf']
run = 'go build -trimpath -ldflags="-s -w -buildid=" -o .cache/ebpf-same-cgroup-mark .'

[tasks.'test:go']
description = 'Run Go tests for a whole project'
depends = ['build:bpf']
dir = 'test'
wait_for = ['generate:*', 'lint:*'] # Avoid interleaved output with linters.
run = 'gotestsum -- -race -timeout=60s ./...'

[tasks.'cover:go:total']
description = 'Show Go test coverage total'
depends = 'cover:go:generate'
run = 'go tool cover -func={{vars.cover}} | tail -n 1 | xargs echo'

[tasks.'cover:go:browse']
description = 'Show Go test coverage in a browser'
depends = 'cover:go:generate'
run = 'go tool cover -html={{vars.cover}}'

[tasks.'cover:go:generate']
hide = true
depends = ['cachedir', 'build:bpf']
dir = 'test'
sources = ['**/*.go']
outputs = ['../{{vars.cover}}']
run = '''
gotestsum -- \
    -coverpkg="$(cd .. && go list ./... | paste -s -d,)" \
    -coverprofile ../{{vars.cover}} \
    ./...
go tool cover -html=../{{vars.cover}} -o ../{{vars.cover}}.html
'''

# Generate Go mocks in /test submodule using mirrored directory structure.
[tasks.mockgen]
hide = true
dir = "{{cwd}}"
run = '''
MODROOT=$(dirname "$(go env GOMOD)")
PKGREL=$(realpath --relative-to="$MODROOT" .)
mockgen -package="$(basename "$PKGREL")" -source="$GOFILE" \
    -destination="$(realpath --relative-to=. "$MODROOT/test/$PKGREL")/mock.${GOFILE%%.go}.go"
'''

[tasks.go-mockgen]
hide = true
dir = "{{cwd}}"
run = '''
MODROOT=$(dirname "$(go env GOMOD)")
PKGREL=$(realpath --relative-to="$MODROOT" .)
go-mockgen -o "$(realpath --relative-to=. "$MODROOT/test/$PKGREL")/stub.${GOFILE%%.go}.go" \
    -f --prefix Stub "$@" .
'''

# Runs a command which changes files, except files with git attribute "vendored"
# (see .gitattributes): they are restored, so they must have no uncommitted changes.
[tasks.keep-vendored]
hide = true
usage = 'arg "<command>" var=#true double_dash="automatic" help="Command with arguments"'
run = '''
git diff --quiet HEAD -- ':(attr:vendored)' || { echo 'vendored files have uncommitted changes' >&2; exit 1; }
eval "$usage_command" || status=$?
git ls-files -z ':(attr:vendored)' | xargs -0 -r git restore --
exit ${status:-0}
'''

[tasks.cachedir]
hide = true
run = 'mkdir -p .cache'
