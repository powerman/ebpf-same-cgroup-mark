name: Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Cache bpftool
        uses: actions/cache@v4
        with:
          path: .cache/bpftool-bin
          key: bpftool-${{ runner.arch }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev nftables socat
          if test -f .cache/bpftool-bin/bpftool; then
            sudo install -m 755 .cache/bpftool-bin/bpftool /usr/local/bin/
          elif ! bpftool --version &>/dev/null; then
            git clone --depth 1 --recurse-submodules \
              https://github.com/libbpf/bpftool.git /tmp/bpftool
            make -C /tmp/bpftool/src -j"$(nproc)" || test -x /tmp/bpftool/src/bpftool
            mkdir -p .cache/bpftool-bin
            cp /tmp/bpftool/src/bpftool .cache/bpftool-bin/
            sudo install -m 755 /tmp/bpftool/src/bpftool /usr/local/bin/
            rm -rf /tmp/bpftool
          fi
          bpftool --version

      - uses: jdx/mise-action@v4
      - run: git reset --hard

      - uses: powerman/.github/.github/actions/cache-go-and-tools@main

      - name: Build
        run: mise run build

      - name: Integration test
        run: sudo -E bash .github/workflows/integration.sh
