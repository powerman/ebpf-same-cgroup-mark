name: Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            linux-tools-common linux-tools-azure \
            clang llvm libbpf-dev netcat-openbsd nftables
          # The bpftool wrapper from linux-tools-common dispatches to
          # /usr/lib/linux-tools/$(uname -r)/bpftool, which may not exist
          # when the running kernel version differs from the installed
          # linux-tools-azure package, or because bpftool is missing from
          # some linux-tools-* packages on Ubuntu 24.04 (known bug).
          # Try standalone bpftool package first, then fall back to
          # finding any installed bpftool binary on the system.
          sudo apt-get install -y --no-install-recommends bpftool 2>/dev/null || true
          if ! command -v bpftool &>/dev/null; then
            bpftool="$(find / -xdev -type f -name bpftool \
              ! -path '/proc/*' ! -path '/sys/*' ! -path '/usr/lib/modules/*' \
              2>/dev/null | head -1)"
            if [ -n "$bpftool" ]; then
              sudo ln -fs "$bpftool" /usr/local/bin/bpftool
            else
              # Build bpftool from the libbpf mirror repo.
              git clone --depth 1 https://github.com/libbpf/bpftool.git \
                /tmp/bpftool 2>/dev/null
              make -s -C /tmp/bpftool/src -j"$(nproc)" 2>/dev/null
              sudo cp /tmp/bpftool/src/bpftool /usr/local/bin/
              rm -rf /tmp/bpftool
            fi
          fi

      - uses: jdx/mise-action@v4
      - run: git reset --hard # Work around https://github.com/jdx/mise/discussions/8270.

      - uses: powerman/.github/.github/actions/cache-go-and-tools@main

      - name: Build
        run: mise run build

      - name: Run shell-only integration test
        env:
          MARK: '0x40000000'
          PORT_SAME: '18080'
          PORT_OTHER: '18081'
          CGROUP_ROOT: /sys/fs/cgroup/ebpf-same-cgroup-mark-test
        run: |
          set -euo pipefail

          BINARY=.cache/ebpf-same-cgroup-mark
          TABLE=same_cgroup_mark_test
          CHAIN=output
          SAME_CGROUP="$CGROUP_ROOT/same"
          OTHER_CGROUP="$CGROUP_ROOT/other"

          start_listener() {
            local cgroup_path="$1"
            local port="$2"
            sudo bash -c "echo \$\$ > '$cgroup_path/cgroup.procs'; exec timeout 10 nc -l 127.0.0.1 '$port' >/dev/null" &
            LISTENER_PID=$!
          }

          wait_listener() {
            local port="$1"
            for _ in $(seq 50); do
              if sudo ss -ltn "sport = :$port" | grep -q LISTEN; then
                return 0
              fi
              sleep 0.1
            done
            return 1
          }

          run_client() {
            local cgroup_path="$1"
            local port="$2"
            sudo bash -c "echo \$\$ > '$cgroup_path/cgroup.procs'; printf 'ping\n' | timeout 10 nc 127.0.0.1 '$port' >/dev/null"
          }

          rule_packets() {
            local port="$1"
            sudo nft list chain inet "$TABLE" "$CHAIN" | grep "dport $port" | sed -E 's/.*counter packets ([0-9]+).*/\1/'
          }

          cleanup() {
            sudo "$BINARY" unload || true
            sudo nft delete table inet "$TABLE" || true
            sudo rmdir "$SAME_CGROUP" "$OTHER_CGROUP" "$CGROUP_ROOT" || true
          }

          cleanup
          sudo mkdir -p "$SAME_CGROUP" "$OTHER_CGROUP"

          sudo nft -f - <<EOF
          table inet $TABLE {
            chain $CHAIN {
              type filter hook output priority 0; policy accept;
              tcp dport $PORT_SAME meta mark & $MARK == $MARK counter log prefix "same-cgroup-positive "
              tcp dport $PORT_OTHER meta mark & $MARK == $MARK counter log prefix "same-cgroup-negative "
            }
          }
          EOF

          sudo dmesg -C || true
          sudo "$BINARY" load -m "$MARK"

          start_listener "$SAME_CGROUP" "$PORT_SAME"
          wait_listener "$PORT_SAME"
          run_client "$SAME_CGROUP" "$PORT_SAME"
          wait "$LISTENER_PID"

          POSITIVE_PACKETS="$(rule_packets "$PORT_SAME")"
          sudo dmesg | tee positive.log
          test "${POSITIVE_PACKETS:-0}" -gt 0
          grep -q 'same-cgroup-positive' positive.log

          sudo dmesg -C || true

          start_listener "$SAME_CGROUP" "$PORT_OTHER"
          wait_listener "$PORT_OTHER"
          run_client "$OTHER_CGROUP" "$PORT_OTHER"
          wait "$LISTENER_PID"

          NEGATIVE_PACKETS="$(rule_packets "$PORT_OTHER")"
          sudo dmesg | tee negative.log
          test "${NEGATIVE_PACKETS:-0}" -eq 0
          if grep -q 'same-cgroup-negative' negative.log; then
            echo 'unexpected mark on cross-cgroup connection' >&2
            exit 1
          fi

          cleanup
